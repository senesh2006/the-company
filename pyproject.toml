[tool.poetry]
name = "the-company"
version = "0.1.0"
description = "Backend for The Company - an AI multi-agent system"
authors = ["Senesh <senesh@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic-settings = "^2.3.0"
pyjwt = "^2.8.0"
sqlalchemy = "^2.0.30"
asyncpg = "^0.29.0"
supabase = "^2.6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
black = "^24.4.2"
ruff = "^0.4.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
