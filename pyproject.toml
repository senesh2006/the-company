[tool.poetry]
name = "the-company"
version = "0.1.0"
description = "Backend for The Company - an AI multi-agent system"
authors = ["Senesh <senesh@example.com>"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic-settings = "^2.3.0"
pyjwt = "^2.8.0"
sqlalchemy = "^2.0.30"
asyncpg = "^0.29.0"
supabase = "^2.6.0"
langchain = "^0.2.14"
langchain-openai = "^0.1.22"
langgraph = "^0.2.8"
langgraph-checkpoint-postgres = "^1.0.3"
psycopg = {extras = ["binary"], version = "^3.2.1"}
psycopg-pool = "^3.2.2"
python-multipart = "^0.0.9"
pypdf = "^4.2.0"
httpx = "^0.27.0"
stripe = "^9.0.0"
composio = "^0.15.0"
llmlingua = "^0.2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
black = "^24.4.2"
ruff = "^0.4.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
